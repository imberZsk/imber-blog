<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedding Top-K</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0e1110;
        color: #e4e4e7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 18px;
      }

      label,
      input,
      button {
        font: inherit;
      }

      label {
        display: grid;
        gap: 8px;
        color: #a1a1aa;
        font-size: 12px;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      input,
      button {
        min-height: 38px;
        border: 1px solid #3f3f46;
        border-radius: 6px;
      }

      input {
        min-width: 0;
        padding: 0 12px;
        background: #181b1a;
        color: inherit;
      }

      button {
        padding: 0 16px;
        background: #78e2bf;
        color: #10221c;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 20px;
        margin: 14px 0 10px;
        color: #a1a1aa;
        font-size: 12px;
      }

      ol {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: grid;
        grid-template-columns: 2rem minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        padding: 12px;
        border: 1px solid #2f3331;
        background: #151817;
      }

      .rank,
      .score {
        font-family: ui-monospace, monospace;
        color: #78e2bf;
        font-size: 12px;
      }

      .document-id {
        margin-bottom: 5px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #a1a1aa;
      }

      .document-text {
        line-height: 1.6;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <label>
      查询文本
      <span class="controls">
        <input id="query" value="退款多久能到账" />
        <button id="search" type="button">运行 Top-K</button>
      </span>
    </label>
    <p id="status">首次运行会加载同源部署的 bge-small-zh-v1.5 量化模型。</p>
    <ol id="results"></ol>

    <script type="module">
      import { env, pipeline } from '/vendor/transformers/transformers.min.js'

      /** 强制使用站点同源的模型与 WASM 资产，避免运行时依赖第三方 CDN。 */
      env.allowRemoteModels = false
      env.allowLocalModels = true
      env.useBrowserCache = false
      env.localModelPath = '/models/'
      env.backends.onnx.wasm.wasmPaths = '/vendor/transformers/'

      /** 实验中待召回的候选文档。 */
      const documents = [
        { id: 'refund#1', text: '退款审核通过后三个工作日内原路退回。' },
        { id: 'shipping#1', text: '订单发货后可在物流页面查看进度。' },
        { id: 'invoice#1', text: '电子发票开具后会发送到下单邮箱。' }
      ]
      /** 避免每次查询重复初始化的特征提取 Pipeline。 */
      let extractorPromise

      /** 对查询和文档生成 512 维语义向量并渲染 Top-K。 */
      async function runSearch() {
        /** 用户当前需要检索的查询。 */
        const query = document.querySelector('#query').value.trim()
        /** 运行按钮用于防止重复提交。 */
        const searchButton = document.querySelector('#search')
        /** 当前模型下载或计算状态。 */
        const status = document.querySelector('#status')
        /** Top-K 结果列表容器。 */
        const results = document.querySelector('#results')

        if (!query) {
          status.textContent = '请先输入查询文本。'
          return
        }

        searchButton.disabled = true
        results.replaceChildren()
        status.textContent = '正在加载模型并生成 Embedding……'

        try {
          extractorPromise ||= pipeline('feature-extraction', 'bge-small-zh-v1.5', {
            dtype: 'q8', // 使用仓库内 24 MB 量化模型，降低首次加载成本。
            device: 'wasm' // 优先保证浏览器覆盖率，不强制要求 WebGPU。
          })
          /** 已加载的中文 Embedding 特征提取器。 */
          const extractor = await extractorPromise
          /** 查询和候选文档的归一化 512 维向量。 */
          const embeddings = await extractor([query, ...documents.map((document) => document.text)], {
            pooling: 'cls', // bge 模型使用 CLS 向量作为句子表示。
            normalize: true // 归一化后点积即余弦相似度。
          })
          /** 按输入顺序切分后的向量数组。 */
          const vectors = embeddings.tolist()
          /** 当前查询的语义向量。 */
          const queryVector = vectors[0]
          /** 按余弦相似度从高到低排序的候选。 */
          const rankedDocuments = documents
            .map((document, index) => ({
              ...document,
              score: queryVector.reduce(
                (similarity, value, dimensionIndex) => similarity + value * vectors[index + 1][dimensionIndex],
                0
              )
            }))
            .sort((left, right) => right.score - left.score)
            .slice(0, 2)

          rankedDocuments.forEach((rankedDocument, index) => {
            /** 单条召回结果的语义容器。 */
            const item = document.createElement('li')
            /** 单条结果的排名序号。 */
            const rank = document.createElement('span')
            /** 文档信息的布局容器。 */
            const documentSummary = document.createElement('span')
            /** 被召回文档的稳定标识。 */
            const documentId = document.createElement('div')
            /** 被召回文档的正文。 */
            const documentText = document.createElement('div')
            /** 查询与文档的余弦相似度。 */
            const score = document.createElement('span')

            rank.className = 'rank'
            rank.textContent = `#${index + 1}`
            documentId.className = 'document-id'
            documentId.textContent = rankedDocument.id
            documentText.className = 'document-text'
            documentText.textContent = rankedDocument.text
            score.className = 'score'
            score.textContent = rankedDocument.score.toFixed(4)
            documentSummary.append(documentId, documentText)
            item.append(rank, documentSummary, score)
            results.append(item)
          })
          status.textContent = `已使用 ${queryVector.length} 维真实 Embedding 完成 Top-2。`
        } catch (error) {
          status.textContent = `模型加载或向量计算失败：${error instanceof Error ? error.message : String(error)}`
        } finally {
          searchButton.disabled = false
        }
      }

      document.querySelector('#search').addEventListener('click', runSearch)
    </script>
  </body>
</html>
